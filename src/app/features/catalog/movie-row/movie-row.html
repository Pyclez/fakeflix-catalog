@if (movies().length) {
  <section class="movie-row">
    <h2 class="movie-row__title">{{ title() }}</h2>

    <div class="movie-row__viewport-wrap">
      @if (showArrows()) {
        <button
          class="movie-row__arrow movie-row__arrow--prev"
          type="button"
          (click)="prev()"
          aria-label="Filmes anteriores"
        >
          ‹
        </button>
      }

      <div class="movie-row__viewport" #viewport>
        <div
          class="movie-row__track"
          #track
          [style.transform]="'translateX(-' + page() * viewportWidth() + 'px)'"
          [style.transition]="animated() ? 'transform 0.4s ease' : 'none'"
        >
          @for (movie of movies(); track movie.id) {
            <app-movie-card [movie]="movie" (select)="movieSelected.emit($event)" />
          }
        </div>
      </div>

      @if (showArrows()) {
        <button
          class="movie-row__arrow movie-row__arrow--next"
          type="button"
          (click)="next()"
          aria-label="Próximos filmes"
        >
          ›
        </button>
      }
    </div>
  </section>
}
